<!doctype html>
<html lang="de-CH">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nimon</title>
  <meta name="description" content="Persönliche Homepage von Niculina und Ramon">
  <style>
    :root {
      --bg: #fafaf8;
      --text: #222;
      --muted: #666;
      --accent: #c0392b;
      --line: #e3e3e0;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1a1a1a;
        --text: #eee;
        --muted: #aaa;
        --accent: #e8735f;
        --line: #333;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      line-height: 1.6;
    }
    main {
      max-width: 640px;
      margin: 0 auto;
      padding: 4rem 1.25rem 2rem;
    }
    h1 {
      font-size: 2.2rem;
      margin: 0 0 .25rem;
      letter-spacing: -.02em;
    }
    .tagline {
      color: var(--muted);
      margin: 0 0 2.5rem;
      font-size: 1.1rem;
    }
    h2 {
      font-size: 1.1rem;
      margin: 2rem 0 .5rem;
      padding-bottom: .3rem;
      border-bottom: 1px solid var(--line);
    }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
    ul { padding-left: 1.2rem; }
    footer {
      margin-top: 4rem;
      font-size: .85rem;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <main>
    <h1>Niculina & Ramon</h1>
    <footer>
      © <span id="jahr">2026</span> Ramon Rinaldi
    </footer>
  </main>
  <script>
    document.getElementById("jahr").textContent = new Date().getFullYear();
  </script>
</body>
</html>
