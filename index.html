<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>nimon.ch</title>
  <meta name="description" content="nimon.ch – under construction">
  <style>
    :root {
      --bg: #0c0f0c;
      --fg: #b8f5b0;
      --dim: #5f8a5a;
      --accent: #f5d76e;
      --err: #ff7b72;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      font: 15px/1.6 ui-monospace, "Cascadia Mono", "SF Mono", Menlo, Consolas, monospace;
      cursor: text;
    }
    body::after { /* subtle scanlines */
      content: "";
      position: fixed; inset: 0;
      pointer-events: none;
      background: repeating-linear-gradient(to bottom, rgba(0,0,0,.18) 0 1px, transparent 1px 3px);
    }
    #term {
      max-width: 820px;
      margin: 0 auto;
      padding: 2.5rem 1rem 4rem;
      white-space: pre-wrap;
      word-break: break-word;
      text-shadow: 0 0 6px rgba(184,245,176,.35);
    }
    .prompt { color: var(--accent); }
    .dim { color: var(--dim); }
    .err { color: var(--err); }
    .cursor {
      display: inline-block;
      width: .6em; height: 1.1em;
      vertical-align: text-bottom;
      background: var(--fg);
      animation: blink 1s steps(1) infinite;
    }
    @keyframes blink { 50% { opacity: 0; } }
    #input {
      position: absolute; left: -9999px; opacity: 0;
    }
    @media (prefers-reduced-motion: reduce) {
      .cursor { animation: none; }
    }
  </style>
</head>
<body>
  <div id="term" aria-live="polite"></div>
  <input id="input" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Enter command">

  <script>
    const term = document.getElementById("term");
    const input = document.getElementById("input");
    const PROMPT = "guest@nimon.ch:~$ ";
    const reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    const sleep = ms => new Promise(r => setTimeout(r, reduced ? 0 : ms));

    function line(text = "", cls = "") {
      const el = document.createElement("div");
      if (cls) el.className = cls;
      el.textContent = text;
      term.appendChild(el);
      window.scrollTo(0, document.body.scrollHeight);
      return el;
    }

    function promptLine() {
      const el = document.createElement("div");
      const p = document.createElement("span");
      p.className = "prompt";
      p.textContent = PROMPT;
      const cmd = document.createElement("span");
      el.append(p, cmd);
      term.appendChild(el);
      return cmd;
    }

    async function typeCmd(text) {
      const cmd = promptLine();
      const cur = document.createElement("span");
      cur.className = "cursor";
      cmd.after(cur);
      await sleep(500);
      for (const ch of text) {
        cmd.textContent += ch;
        await sleep(55 + Math.random() * 70);
      }
      await sleep(300);
      cur.remove();
    }

    const start = Date.now();
    const commands = {
      help: () => [
        "Available commands:",
        "  help      show this overview",
        "  status    site status",
        "  date      current date and time",
        "  uptime    how long you've been here",
        "  ls        list files (ls -a shows hidden ones)",
        "  cat       print a file (e.g. cat readme.txt)",
        "  rm        delete a file (e.g. rm todo.txt)",
        "  ping      test the connection",
        "  clear     clear the screen",
        "  author    show the author"
      ],
      status: () => [
        "[ OK ] DNS",
        "[ OK ] HTTPS",
        "[ OK ] index.html",
        "[ .. ] Inhalt ......... under construction"
      ],
      date: () => [new Date().toLocaleString("en-GB", { dateStyle: "full", timeStyle: "medium" })],
      uptime: () => {
        const s = Math.floor((Date.now() - start) / 1000);
        return [`You have been here for ${Math.floor(s / 60)} min ${s % 60} s.`];
      },
      ls: () => [listFiles(false)],
      ping: () => [
        "PING nimon.ch: 56 data bytes",
        ...[1, 2, 3].map(i => `64 bytes from nimon.ch: icmp_seq=${i} ttl=64 time=${(Math.random() * 20 + 4).toFixed(1)} ms`),
        "--- 3 packets transmitted, 3 received, 0% packet loss ---"
      ],
      whoami: () => ["guest"],
      author: () => ["Ramon Rinaldi - with kind support from Claudia"],
      sudo: () => [["Nice try.", "err"]],
      exit: () => ["There is no exit here. Only refresh."]
    };

    const files = {
      "readme.txt": ["This site is under construction.", "Until then: type 'help'."],
      "todo.txt": ["[x] Set up domain", "[x] HTTPS", "[ ] Content", "[ ] Coffee"],
      ".secret": ["You found it. There is nothing to see here. :)"]
    };

    function listFiles(all) {
      const names = Object.keys(files).filter(n => all || !n.startsWith("."));
      if (all) names.unshift(".", "..");
      return names.length ? names.join("  ") : "";
    }

    // rm: deletes files from the in-memory file list (back after a page reload)
    function rm(args) {
      const force = args.some(a => /^-[a-z]*f/.test(a));
      const recursive = args.some(a => /^-[a-z]*r/i.test(a));
      const targets = args.filter(a => !a.startsWith("-"));
      if (recursive && targets.some(t => t === "/" || t === "/*" || t === "~" || t === "*")) {
        return line("rm: Nice try. The universe stays where it is.", "err");
      }
      if (!targets.length) return line("rm: missing operand", "err");
      for (const t of targets) {
        if (t === "*") {
          Object.keys(files).filter(n => !n.startsWith(".")).forEach(n => delete files[n]);
        } else if (t === "." || t === "..") {
          line(`rm: refusing to remove '.' or '..' directory: skipping '${t}'`, "err");
        } else if (files[t]) {
          delete files[t];
        } else if (!force) {
          line(`rm: cannot remove '${t}': No such file or directory`, "err");
        }
      }
    }

    function run(raw) {
      const [cmd, ...args] = raw.trim().split(/\s+/);
      if (!cmd) return;
      if (cmd === "clear") { term.innerHTML = ""; return; }
      if (cmd === "cat") {
        const f = args[0];
        if (!f) return line("cat: missing file name", "err");
        if (!files[f]) return line(`cat: ${f}: No such file or directory`, "err");
        files[f].forEach(t => line(t));
        return;
      }
      if (cmd === "rm") return rm(args);
      if (cmd === "ls" && args.some(a => /^-[a-z]*a/.test(a))) {
        return line(listFiles(true));
      }
      const fn = commands[cmd.toLowerCase()];
      if (!fn) return line(`${cmd}: command not found. Try 'help'.`, "err");
      fn().filter(t => t !== "").forEach(t => Array.isArray(t) ? line(t[0], t[1]) : line(t));
    }

    // interactive input line
    let activeCmd = null, activeCur = null;
    const history = [];
    let hIndex = 0;

    function newPrompt() {
      activeCmd = promptLine();
      activeCur = document.createElement("span");
      activeCur.className = "cursor";
      activeCmd.after(activeCur);
      input.value = "";
      input.focus({ preventScroll: true });
      window.scrollTo(0, document.body.scrollHeight);
    }

    input.addEventListener("input", () => { activeCmd.textContent = input.value; });
    input.addEventListener("keydown", e => {
      if (e.key === "Enter") {
        e.preventDefault();
        const val = input.value;
        activeCur.remove();
        if (val.trim()) { history.push(val); }
        hIndex = history.length;
        run(val);
        newPrompt();
      } else if (e.key === "ArrowUp" && history.length) {
        e.preventDefault();
        hIndex = Math.max(0, hIndex - 1);
        input.value = history[hIndex];
        activeCmd.textContent = input.value;
      } else if (e.key === "ArrowDown" && history.length) {
        e.preventDefault();
        hIndex = Math.min(history.length, hIndex + 1);
        input.value = history[hIndex] ?? "";
        activeCmd.textContent = input.value;
      }
    });
    document.addEventListener("click", () => input.focus({ preventScroll: true }));

    // Intro
    (async () => {
      line("nimon.ch – Terminal v1.0", "dim");
      line("", "");
      await typeCmd("ping -c 1 nimon.ch");
      line("64 bytes from nimon.ch: icmp_seq=1 ttl=64 time=7.3 ms");
      line("", "");
      await typeCmd("status");
      for (const t of commands.status()) { await sleep(250); line(t); }
      line("", "");
      await typeCmd("cat readme.txt");
      files["readme.txt"].forEach(t => line(t));
      line("", "");
      newPrompt();
    })();
  </script>
</body>
</html>
